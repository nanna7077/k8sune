name: Package and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

# One release pipeline per tag. This prevents a tag force-push or duplicate
# delivery from publishing the same assets and tap changes concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Verify release tag is on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag ancestry
        run: |
          git fetch origin main
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tags must point to a commit reachable from main."
            exit 1
          fi

  build:
    needs: validate-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci --prefix frontend


      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Add macOS Rust targets
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libfuse2 \
            patchelf \
            zsync

      - name: Bundle Python dependencies
        run: |
          pip3 install -t backend/libs -r backend/requirements.txt

      - name: Verify bundled Python dependencies
        run: |
          PYTHONPATH=backend/libs python3 -c "import fastapi, kubernetes, kubernetes_asyncio, sse_starlette, uvicorn, websockets, yaml"

      - name: Derive package version from release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re

          tag = os.environ['RELEASE_TAG']
          raw = tag[1:] if tag.startswith('v') else tag
          semver = raw
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', semver):
              # Existing tags such as 0.0.2b-test5 are useful display labels,
              # but Cargo/Tauri require strict SemVer for bundle metadata.
              match = re.fullmatch(r'(\d+\.\d+\.\d+)b-([0-9A-Za-z.-]+)', raw)
              if not match:
                  raise SystemExit(f'Cannot derive a Cargo/Tauri SemVer from tag {tag}. Use vX.Y.Z[-pre] or vX.Y.Zb-pre.')
              semver = f'{match.group(1)}-beta.{match.group(2)}'

          with open('src-tauri/tauri.conf.json', encoding='utf-8') as source:
              config = json.load(source)
          config['version'] = semver
          with open('src-tauri/tauri.conf.json', 'w', encoding='utf-8') as target:
              json.dump(config, target, indent=2)
              target.write('\n')

          cargo_path = 'src-tauri/Cargo.toml'
          with open(cargo_path, encoding='utf-8') as source:
              cargo = source.read()
          cargo, replacements = re.subn(r'(?m)^version = "[^"]+"$', f'version = "{semver}"', cargo, count=1)
          if replacements != 1:
              raise SystemExit('Could not update the package version in src-tauri/Cargo.toml')
          with open(cargo_path, 'w', encoding='utf-8') as target:
              target.write(cargo)

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'K8SUNE_RELEASE_TAG={tag}\nK8SUNE_PACKAGE_VERSION={semver}\n')
          print(f'Building {tag} with Cargo/Tauri package version {semver}')
          PY

      - name: Build Tauri application
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            npm run tauri build -- --target universal-apple-darwin --verbose
          else
            npm run tauri build -- --verbose
          fi
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Sign and notarize DMG
        if: matrix.os == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        run: |
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg")
          codesign --sign "$APPLE_CERTIFICATE" --deep --force "$DMG"
          # Notarize (requires Apple notary credentials)
          xcrun altool --notarize-app -f "$DMG" --primary-bundle-id "com.nanna7077.k8sune" -u "$APPLE_NOTARY_USER" -p "$APPLE_NOTARY_PASSWORD"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}

      - name: Gather built bundles
        run: |
          mkdir -p artifacts
          if [ -d "src-tauri/target/release/bundle" ]; then
            find src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} artifacts/ \;
          fi
          if [ -d "src-tauri/target/universal-apple-darwin/release/bundle/dmg" ]; then
            find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" -exec cp {} artifacts/ \;
            # Generate SHA256 checksum for the DMG file
            DMG_FILE=$(find artifacts -name "*.dmg" | head -n 1)
            if [ -n "$DMG_FILE" ]; then
              shasum -a 256 "$DMG_FILE" | awk '{print $1}' > "${DMG_FILE}.sha256"
            fi
          fi
          VERSION="${{ github.ref_name }}"
          
          # Prepare a temporary distribution directory containing both the binary and the backend resources
          mkdir -p dist-temp/backend
          cp -r backend/api backend/cluster backend/models backend/utils backend/libs backend/main.py dist-temp/backend/
          
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            cp src-tauri/target/universal-apple-darwin/release/k8sune dist-temp/
            tar -czf "artifacts/k8sune-macos-${VERSION}.tar.gz" -C dist-temp k8sune backend
            shasum -a 256 "artifacts/k8sune-macos-${VERSION}.tar.gz" | awk '{print $1}' > "artifacts/k8sune-macos-${VERSION}.tar.gz.sha256"
          else
            cp src-tauri/target/release/k8sune dist-temp/
            tar -czf "artifacts/k8sune-linux-${VERSION}.tar.gz" -C dist-temp k8sune backend
            shasum -a 256 "artifacts/k8sune-linux-${VERSION}.tar.gz" | awk '{print $1}' > "artifacts/k8sune-linux-${VERSION}.tar.gz.sha256"
          fi
          rm -rf dist-temp

      - name: Upload artifacts for workflow run
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-artifacts-${{ matrix.os }}
          path: artifacts/

  publish:
    needs: [validate-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: download-artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-artifacts
          find download-artifacts -type f -exec cp {} release-artifacts/ \;

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: download-artifacts

      - name: Checkout/Initialize Homebrew tap repository
        env:
          TAP_REPO: ${{ secrets.HOMEBREW_TAP_REPO }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap || {
            echo "Clone failed. Initializing manually..."
            mkdir -p tap
            cd tap
            git init
            git remote add origin "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git"
            cd ..
          }
          cd tap
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b main || git checkout main || true

      - name: Generate/Update Homebrew formula and cask
        env:
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          # 1. Generate/Update Formula
          mkdir -p tap/Formula
          FORMULA_PATH="tap/Formula/k8sune.rb"
          MAC_SHA=$(cat download-artifacts/tauri-build-artifacts-macos-latest/k8sune-macos-${RELEASE_TAG}.tar.gz.sha256 | tr -d '\r\n[:space:]')
          LINUX_SHA=$(cat download-artifacts/tauri-build-artifacts-ubuntu-latest/k8sune-linux-${RELEASE_TAG}.tar.gz.sha256 | tr -d '\r\n[:space:]')
          
          cat > "$FORMULA_PATH" <<EOF2
          class K8sune < Formula
            desc "Modern and integrated desktop controller for Kubernetes"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"
            license "MPL-2.0"

            on_macos do
              url "https://github.com/${REPO}/releases/download/${RELEASE_TAG}/k8sune-macos-${RELEASE_TAG}.tar.gz"
              sha256 "${MAC_SHA}"
            end

            on_linux do
              url "https://github.com/${REPO}/releases/download/${RELEASE_TAG}/k8sune-linux-${RELEASE_TAG}.tar.gz"
              sha256 "${LINUX_SHA}"
            end

            def install
              bin.install "k8sune"
              bin.install "backend"
            end
          end
          EOF2

          # 2. Generate/Update Cask
          mkdir -p tap/Casks
          CASK_PATH="tap/Casks/k8sune.rb"
          DMG_SHA_FILE=$(find download-artifacts/tauri-build-artifacts-macos-latest -name "*.dmg.sha256" | head -n 1)
          DMG_SHA=$(cat "$DMG_SHA_FILE" | tr -d '\r\n[:space:]')
          # Tauri names bundles from its package version, which may differ from
          # a release tag (for example pre-release tags). Always publish the
          # exact asset basename produced by the build instead of guessing it.
          DMG_NAME=$(basename "$DMG_SHA_FILE" .sha256)

          cat > "$CASK_PATH" <<EOF3
          cask "k8sune" do
            version "${VERSION}"
            sha256 "${DMG_SHA}"

            url "https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${DMG_NAME}"
            name "k8sune"
            desc "Modern and integrated desktop controller for Kubernetes"
            homepage "https://github.com/${REPO}"

            app "k8sune.app"
          end
          EOF3

      - name: Commit and push formula and cask
        run: |
          cd tap
          git add Formula/k8sune.rb Casks/k8sune.rb
          if git diff --cached --quiet; then
            echo "Formula and cask are already current; nothing to push."
          else
            git commit -m "Release ${VERSION}"
            git push origin main
          fi
